services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantpilot}
      POSTGRES_DB: ${POSTGRES_DB:-quantpilot}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quantpilot}:${POSTGRES_PASSWORD:-quantpilot}@db:5432/${POSTGRES_DB:-quantpilot}
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:-}
      QUANTPILOT_AI_API_KEY: ${QUANTPILOT_AI_API_KEY:-${OPENAI_API_KEY:-}}
      QUANTPILOT_AI_MODEL: ${QUANTPILOT_AI_MODEL:-gpt-4.1-mini}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quantpilot}:${POSTGRES_PASSWORD:-quantpilot}@db:5432/${POSTGRES_DB:-quantpilot}
    command: ["/app/.venv/bin/python", "-m", "app.paper_worker"]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
