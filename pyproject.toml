[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantpilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "openai>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["packages", "apps/api"]

[tool.setuptools.package-data]
"quantpilot.market_data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
